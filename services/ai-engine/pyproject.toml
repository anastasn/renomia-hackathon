[project]
name = "ai-engine"
version = "0.1.0"
description = "LangGraph + ChromaDB AI engine service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # AI / RAG dependencies — uncomment when ready to implement
    # "langchain>=0.2.0",
    # "langgraph>=0.1.0",
    # "langchain-openai>=0.1.0",      # or langchain-anthropic
    # "langchain-chroma>=0.1.0",
    # "chromadb>=0.5.0",
    # "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
