name: renomia-hackathon

# ─────────────────────────────────────────────────────────────────────────────
# Development-only docker-compose.
# For production, use a proper orchestrator (ECS, k8s, etc.).
# ─────────────────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  env_file:
    - .env

services:
  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      #args:
      #  - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001
    depends_on:
      backend:
        condition: service_healthy

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "5001:5001"
    volumes:
      - ./services/backend:/app/services/backend
      - ./packages/ai/:/app/packages/ai
      - /app/.venv
      # Persist SQLite database between restarts
      - backend_data:/app/data
    environment:
      DEBUG: "true"
      AI_ENGINE_URL: http://ai-engine:5002
    #depends_on:
      #ai-engine:
      #  condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── AI Engine ──────────────────────────────────────────────────────────────
  ai-engine:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai-engine
    ports:
      - "5002:5002"
    volumes:
      - ./services/ai-engine:/app
      - ai_engine_data:/app/data
    environment:
      DEBUG: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
  ai_engine_data:
